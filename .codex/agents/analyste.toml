- Skills à charger avec l'outil Skill seulement si la tâche l'exige (lourds, non préchargés) : `exploratory-data-analysis`, `statistical-analysis`, `statsmodels`, `scikit-learn`, `scientific-visualization`.\r
- Aucun prototype ni tableau de bord client avant l'étape 7 de `context/PIPELINE.md` (2-3 retours concordants).\r
